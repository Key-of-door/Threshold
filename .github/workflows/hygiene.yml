name: Hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No dependencies needed: test the checker, then scan tracked files
      # for personal local paths and broken relative Markdown links.
      - run: npm run check:hygiene
